# Zero Trust access policy — single source of truth for who may call whom.
# Nothing about permissions is hardcoded anywhere else in the project.
# Everything not listed here is denied.
default: deny

rules:
  - id: R1
    from: gateway
    to: worker
    methods: [POST]
    paths: ["/run"]

  - id: R2
    from: worker
    to: model-store
    methods: [GET]
    paths: ["/models/"]

  - id: R3
    from: worker
    to: db
    methods: [QUERY]
    paths: ["inference_logs:select"]